name: Release

# Release Please keeps one draft pull request open with the next version and
# its changelog. Merging that pull request tags the commit and creates a draft
# release; the jobs below check the commit, publish it to crates.io and only
# then publish the release with its notes. See docs/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run at a time, and never cancel one that is halfway through tagging.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The default token cannot start workflows, so the release pull request
      # would never get its checks. A personal access token can.
      - name: Check the Release Please token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "RELEASE_PLEASE_TOKEN is not set. See docs/RELEASING.md." >&2
            exit 1
          fi

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  checks:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release-please, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted Publishing: crates.io trades this run's identity for a token
      # that lives for a few minutes, so no long-lived secret is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The release stays a draft until the crate is on crates.io, so a failed
  # release is never shown as the latest one.
  publish-release:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Write the notes and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          version="${TAG#v}"
          python3 scripts/release-notes.py --version "$version" --run-url "$RUN_URL" --output notes.md
          gh release edit "$TAG" --title "Phasewise $TAG" --notes-file notes.md --draft=false --latest
