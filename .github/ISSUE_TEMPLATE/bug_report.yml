name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. A plan or steps that reproduce it help most.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Version and setup (optional)
      description: The output of `phasewise --version` and `phasewise doctor`.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: For a failed phase, the relevant files from `.phasewise/runs/<run-id>/`. Remove anything private first.
      render: text
