[package]
name = "phasewise"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Run big plans with Claude Code or Codex one phase at a time — verified, checkpointed, and reviewable."
license = "MIT"
repository = "https://github.com/userfypp/phasewise"
readme = "README.md"
keywords = ["claude", "codex", "agent", "cli", "git"]
categories = ["command-line-utilities", "development-tools"]
# Development files stay in the repository but not in the published crate.
exclude = [
  "/.github",
  "/AGENTS.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/CONTRIBUTORS.md",
  "/assets",
  "/clippy.toml",
  "/release-please-config.json",
  "/.release-please-manifest.json",
  "/docs/ROADMAP.md",
  "/docs/RELEASING.md",
  "/scripts",
  "/src/tui/snapshots",
  "/tests",
]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ctrlc = { version = "3.5.2", features = ["termination"] }
jiff = { version = "1.0.1", features = ["serde"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"
